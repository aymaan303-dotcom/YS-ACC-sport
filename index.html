<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الحسابات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap');

  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

  :root{
    --bg:#0a1e15;
    --paper:#12291d;
    --paper-alt:#163d29;
    --row-hover:#1a4530;
    --ink:#eef6ef;
    --ink-soft:#9dbcac;
    --line:#1f4a34;
    --sidebar-bg:#071912;
    --sidebar-hover:#0f2a1c;
    --sidebar-active:#153a26;
    --sidebar-accent:#ffb100;
    --topbar-bg:#0d2117;
    --gold:#ffb100;
    --gold-soft:#ffe1a3;
    --silver:#a9c9bb;
    --silver-soft:#e3f1e8;
    --c-green:#1f9e5c;
    --c-green-bg:#1f9e5c;
    --c-yellow:#ffb100;
    --c-yellow-bg:#ffce55;
    --c-purple:#8b7bd8;
    --c-purple-bg:#b3a4e8;
    --c-blue:#5fb4e0;
    --c-blue-bg:#a9c9bb;
    --c-red:#d43f30;
    --c-red-bg:#e6543f;
    --c-teal:#2dd4bf;
    --c-teal-bg:#5eead4;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --shadow-md:0 10px 30px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;-webkit-font-smoothing:antialiased;}
  body{
    background:
      radial-gradient(ellipse 1000px 480px at 50% -12%, rgba(255,177,0,.10), transparent 62%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(169,201,187,.05), transparent 55%),
      radial-gradient(ellipse 800px 400px at 0% 100%, rgba(31,158,92,.06), transparent 60%),
      var(--bg);
    color:var(--ink);font-family:'Tajawal',sans-serif;font-size:14px;font-weight:500;
  }

  /* ── App shell ── */
  .app-shell{display:flex;min-height:100vh;flex-direction:row;}

  /* ── Sidebar ── */
  .sidebar{
    width:220px;flex:0 0 220px;background:var(--sidebar-bg);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
    z-index:100;
  }
  .brand{
    padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;gap:10px;
  }
  .brand-icon{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(135deg,#ffb100,#cc8a00);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 36px;
  }
  .brand-title{color:#fff;font-weight:800;font-size:14.5px;line-height:1.2;}
  .brand-sub{color:#8fac9c;font-size:10px;margin-top:1px;}
  .sidebar-section-title{
    font-size:10px;color:#5f8874;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;padding:16px 16px 6px;
  }
  .side-acc{
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:transparent;border:none;color:#9dbcac;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:600;width:100%;text-align:right;
    border-right:3px solid transparent;transition:.12s;
  }
  .side-acc:hover{background:var(--sidebar-hover);color:#dcefe3;}
  .side-acc.active{background:var(--sidebar-active);color:#fff;border-right-color:var(--sidebar-accent);}
  .side-acc-icon{font-size:15px;flex:0 0 20px;text-align:center;}
  .side-acc-info{display:flex;flex-direction:column;flex:1;overflow:hidden;}
  .side-acc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-acc-net{font-size:10.5px;margin-top:1px;}
  .side-acc-net.pos{color:#4ade80;}
  .side-acc-net.neg{color:#f87171;}
  .side-acc.active .side-acc-net.pos{color:#8ff5b8;}
  .side-acc.active .side-acc-net.neg{color:#fca5a5;}
  .side-empty{color:#5f8874;font-size:12px;padding:10px 16px;}
  .sidebar-add-btn{
    margin:8px 12px 4px;background:rgba(255,177,0,.15);border:1px dashed #4a7a5c;
    color:#d9a63d;border-radius:8px;padding:9px;font-weight:700;font-size:12px;
    cursor:pointer;font-family:inherit;width:calc(100% - 24px);transition:.15s;
  }
  .sidebar-add-btn:hover{background:rgba(255,177,0,.25);color:#cfe6d5;}
  .sidebar-footer{
    margin-top:auto;padding:14px 16px;font-size:10.5px;color:#5f8874;
    border-top:1px solid rgba(255,255,255,.05);text-align:center;
  }

  /* ── Right panel (topbar + main) ── */
  .right-panel{flex:1;min-width:0;display:flex;flex-direction:column;}

  /* ── Top bar ── */
  .topbar{
    background:var(--topbar-bg);border-bottom:1px solid var(--line);
    padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:90;box-shadow:var(--shadow);flex-shrink:0;
  }
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar-title{font-weight:800;font-size:15px;color:var(--ink);}
  .topbar-badge{
    font-size:10.5px;background:rgba(255,177,0,.15);color:#ffce55;padding:3px 10px;
    border-radius:20px;font-weight:700;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-date{font-size:12px;color:var(--ink-soft);}
  .topbar-avatar{
    width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffb100,#5fb4e0);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;
  }
  #connStatus{font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(31,158,92,.15);color:#1f9e5c;border:1px solid rgba(31,158,92,.4);}

  /* ── Main content ── */
  .main-content{flex:1;padding:22px 24px 50px;overflow-y:auto;}
  .wrap{max-width:1100px;margin:0 auto;}

  /* ── Combined bar ── */
  .combined{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;
  }
  @media(max-width:700px){.combined{grid-template-columns:repeat(2,1fr);}}
  .combined-title{grid-column:1/-1;font-size:11px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
  .combined-card{
    border-radius:12px;padding:16px 18px;color:#fff;position:relative;overflow:hidden;
  }
  .combined-card::after{
    content:'';position:absolute;left:-20px;bottom:-20px;width:80px;height:80px;
    border-radius:50%;background:rgba(255,255,255,.08);
  }
  .combined-card .lbl{font-size:11px;opacity:.85;margin-bottom:8px;font-weight:600;}
  .combined-card .val{font-size:22px;font-weight:900;letter-spacing:-.5px;}
  .combined-card.c1{background:linear-gradient(135deg,#1f9e5c,#4fdb93);}
  .combined-card.c2{background:linear-gradient(135deg,#d99a1a,#ffce55);}
  .combined-card.c3{background:linear-gradient(135deg,#5fb4e0,#e3f1e8);}
  .combined-card.c4{background:linear-gradient(135deg,#cc8a00,#ffb100);}

  /* ── Summary cards ── */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:640px){.summary{grid-template-columns:repeat(2,1fr);}}
  .card{
    background:var(--paper);border-radius:12px;padding:15px 18px;
    box-shadow:var(--shadow);border:1px solid var(--line);transition:.15s;
  }
  .card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .card .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
  .card .val{font-size:19px;font-weight:800;letter-spacing:-.3px;}
  .card.income .val{color:var(--c-green);}
  .card.expense .val{color:var(--c-red);}
  .card.salary .val{color:var(--c-yellow);}
  .card.stock .val{color:var(--c-blue);}
  .card.net{background:var(--sidebar-bg);}
  .card.net .lbl{color:#8fac9c;}
  .card.net .val{color:#fff;font-size:20px;}
  .card.net.pos{background:linear-gradient(135deg,#17402c,#1f9e5c);}
  .card.net.neg{background:linear-gradient(135deg,#5c1616,#d43f30);}

  /* ── Sections ── */
  .section{background:var(--paper);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 18px;border-bottom:1px solid var(--line);background:var(--paper-alt);
  }
  .section-head .title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.income{background:var(--c-green);}
  .dot.expense{background:var(--c-red);}
  .dot.salary{background:var(--c-yellow);}
  .dot.purchase{background:var(--c-blue);}
  .dot.sale{background:var(--c-green);}
  .dot.cafexpense{background:var(--c-red);}
  .dot.stock{background:var(--c-yellow);}
  .section-head .total{font-weight:800;font-size:14px;}
  .income-section .total,.sale-section .total{color:var(--c-green);}
  .expense-section .total,.cafexpense-section .total{color:var(--c-red);}
  .salary-section .total{color:var(--c-yellow);}
  .purchase-section .total{color:var(--c-blue);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;font-size:11px;color:var(--ink-soft);font-weight:700;
    padding:10px 18px;background:var(--paper-alt);text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 18px;border-bottom:1px solid var(--line);}
  tbody tr:hover td{background:var(--row-hover);}
  tbody tr:last-child td{border-bottom:none;}
  .amt{font-weight:700;}
  .amt.pos{color:var(--c-green);}
  .amt.neg{color:var(--c-red);}
  .del-btn{background:none;border:none;color:#a9c4b0;cursor:pointer;font-size:15px;padding:3px 7px;border-radius:7px;}
  .del-btn:hover{background:rgba(212,63,48,.15);color:var(--c-red);}
  .empty-row{padding:24px;color:var(--ink-soft);font-size:13px;text-align:center;}

  .add-row{
    display:flex;gap:8px;padding:13px 18px;background:var(--paper-alt);
    flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);
  }
  .add-row input,.add-row select{
    flex:1;min-width:100px;border:1.5px solid var(--line);border-radius:8px;
    padding:9px 12px;font-family:inherit;font-size:13px;background:var(--paper);color:var(--ink);
  }
  .add-row input:focus,.add-row select:focus{outline:none;border-color:var(--sidebar-accent);box-shadow:0 0 0 3px rgba(255,177,0,.18);}
  .add-row .date-input{max-width:135px;flex:0 0 135px;}
  .add-row button{
    border:none;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer;
    font-family:inherit;color:#fff;font-size:13px;transition:.15s;
  }
  .add-row button:hover{filter:brightness(1.1);}
  .income-section .add-row button,.sale-section .add-row button{background:var(--c-green);}
  .expense-section .add-row button,.cafexpense-section .add-row button{background:var(--c-red);}
  .salary-section .add-row button{background:var(--c-yellow);}
  .purchase-section .add-row button{background:var(--c-blue);}

  /* new account box */
  .new-account-box{
    background:rgba(255,177,0,.10);border:1.5px dashed rgba(255,177,0,.4);border-radius:11px;
    padding:13px;display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;
  }
  .new-account-box input,.new-account-box select{
    flex:1;min-width:130px;border:1.5px solid rgba(255,177,0,.3);border-radius:8px;
    padding:9px 12px;font-family:inherit;background:var(--paper);
  }
  .new-account-box button{background:var(--sidebar-accent);color:#081712;border:none;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer;}

  /* title row */
  .acc-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .acc-title-row h2{font-weight:900;font-size:20px;margin:0;letter-spacing:-.3px;}
  .acc-badge{font-size:10px;background:rgba(255,177,0,.18);color:#ffce55;padding:3px 11px;border-radius:20px;font-weight:700;margin-right:8px;}
  .acc-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-outline{
    background:var(--paper);border:1.5px solid var(--line);color:var(--ink-soft);
    border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;
    box-shadow:var(--shadow);transition:.15s;
  }
  .btn-outline:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn-outline.statement{color:var(--c-blue);border-color:rgba(255,177,0,.3);}
  .btn-outline.remove{color:var(--c-red);border-color:rgba(212,63,48,.35);}
  .btn-outline.monthly{color:var(--c-yellow);border-color:rgba(255,177,0,.35);}

  .loading{text-align:center;padding:60px;color:var(--ink-soft);}
  .date-cell{color:var(--ink-soft);font-size:12px;white-space:nowrap;min-width:130px;}

  /* people grid */
  .people-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  @media(max-width:700px){.people-grid{grid-template-columns:1fr;}}

  /* reminders */
  .reminders-box{background:rgba(212,63,48,.08);border:1px solid rgba(212,63,48,.35);border-radius:12px;padding:15px 18px;margin-bottom:14px;}
  .reminders-title{font-weight:800;color:var(--c-red);margin-bottom:10px;font-size:14px;}
  .reminder-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--paper);border-radius:9px;padding:10px 13px;margin-bottom:7px;flex-wrap:wrap;
    border:1px solid rgba(212,63,48,.15);
  }
  .reminder-row:last-child{margin-bottom:0;}
  .overdue-tag{background:var(--c-red);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;margin-right:6px;}
  .copy-reminder{white-space:nowrap;}
  .reminder-pay-btn{
    background:linear-gradient(135deg,#1f9e5c,#4fdb93);
    border:none;border-radius:8px;padding:7px 14px;
    color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:.12s;
  }
  .reminder-pay-btn:hover{filter:brightness(1.08);}
  .reminder-pay-btn:active{transform:scale(.95);}

  /* ── Edit deal modal ── */
  #editPurchaseOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
    align-items:center;justify-content:center;z-index:960;padding:16px;
  }
  #editPurchaseOverlay.open{display:flex;}

  #editDealOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
    align-items:center;justify-content:center;z-index:960;padding:16px;
  }
  #editDealOverlay.open{display:flex;}
  .edit-deal-modal{
    background:var(--paper);border-radius:18px;width:100%;max-width:420px;
    padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.2);
  }
  .edm-title{font-weight:900;font-size:17px;margin-bottom:18px;color:var(--ink);}
  .edm-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .edm-lbl{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .edm-input{
    border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;
    font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);
  }
  .edm-input:focus{outline:none;border-color:var(--c-blue);}
  .edm-result{
    background:rgba(255,177,0,.10);border-radius:10px;padding:12px 14px;
    margin:14px 0;display:flex;justify-content:space-between;align-items:center;
  }
  .edm-result-lbl{font-size:12px;color:var(--c-blue);font-weight:600;}
  .edm-result-val{font-size:18px;font-weight:800;color:var(--c-blue);}
  .edm-actions{display:flex;gap:8px;margin-top:6px;}
  .edm-save{flex:1;background:var(--c-blue);color:#fff;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  .edm-cancel{background:var(--paper-alt);color:var(--ink-soft);border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-family:inherit;}
  .edit-deal-btn{
    background:none;border:none;font-size:15px;cursor:pointer;
    padding:4px 7px;border-radius:7px;color:var(--c-blue);
  }
  .edit-deal-btn:hover{background:var(--blue-soft);}
  .clear-deal-btn{
    background:none;border:1.5px solid var(--c-yellow);color:var(--c-yellow);
    border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .clear-deal-btn:hover{background:var(--gold-soft);}

  /* ── Balance cards ── */
  .balances-title{font-weight:800;font-size:14px;color:var(--ink);margin:18px 0 10px;padding-right:4px;}
  .balances-grid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .balance-card{
    background:var(--paper);border-radius:12px;padding:14px 16px;min-width:200px;flex:1;max-width:260px;
    box-shadow:var(--shadow);border:1px solid var(--line);border-top:3px solid var(--c-blue);
  }
  .balance-card.owed{border-top-color:var(--c-red);}
  .balance-card.clear{border-top-color:var(--c-green);}
  .balance-card.supplier{border-top-color:var(--c-blue);}
  .balance-name{font-weight:800;font-size:14px;margin-bottom:4px;}
  .balance-phone{font-size:11px;color:var(--ink-soft);margin-bottom:8px;}
  .balance-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line);}
  .balance-row:last-child{border-bottom:none;}
  .balance-row.big{font-weight:800;font-size:14px;margin-top:6px;padding-top:6px;border-top:2px solid var(--line);border-bottom:none;}
  .balance-empty{color:var(--ink-soft);font-size:13px;padding:10px 4px;}

  /* ── Filter bar ── */
  .filter-bar{
    display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);
    background:var(--paper-alt);
  }
  .filter-btn{
    background:var(--paper);border:1.5px solid var(--line);border-radius:20px;
    padding:5px 14px;font-family:inherit;font-size:12px;font-weight:700;
    cursor:pointer;color:var(--ink-soft);transition:.12s;
  }
  .filter-btn:hover{border-color:var(--sidebar-accent);color:var(--sidebar-accent);}
  .filter-btn.active{background:var(--gold);color:#081712;border-color:var(--gold);}
  .filter-count{
    background:rgba(0,0,0,.1);border-radius:20px;padding:1px 6px;
    font-size:10px;margin-right:3px;
  }
  .filter-btn.active .filter-count{background:rgba(255,255,255,.2);}
  .filter-total{
    display:block;font-size:10px;opacity:.75;margin-top:1px;font-weight:600;
  }
  .cat-tag{
    font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;
  }
  .cat-tag.cat-exp{background:rgba(212,63,48,.15);color:var(--c-red);}
  .cat-tag.cat-sal{background:rgba(255,177,0,.15);color:var(--c-yellow);}
  .cat-tag.cat-adv{background:rgba(154,165,177,.15);color:#5fb4e0;}

  /* ── Compact stats bar ── */
  .stats-bar{
    display:flex;align-items:center;flex-wrap:wrap;gap:0;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:12px 18px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .stat-item{display:flex;flex-direction:column;align-items:center;padding:0 16px;flex:1;min-width:80px;}
  .stat-lbl{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;text-align:center;}
  .stat-val{font-size:17px;font-weight:800;letter-spacing:-.3px;}
  .stat-val.pos{color:var(--c-green);}
  .stat-val.neg{color:var(--c-red);}
  .stat-sep{width:1px;height:36px;background:var(--line);flex:0 0 1px;}
  @media(max-width:500px){
    .stat-item{padding:0 10px;}
    .stat-val{font-size:14px;}
  }

  /* ── Revenue calendar (متابعة الإيراد اليومي) ── */
  .revcal-nav{display:flex;align-items:center;gap:10px;}
  .revcal-nav-btn{
    background:var(--paper);border:1.5px solid var(--line);color:var(--ink);
    border-radius:7px;width:26px;height:26px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;line-height:1;
  }

     هوية "استاد الليل" — لمسة أخيرة: أرقام بطابع لوحة النتائج

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJRq8p5GegbSHp0z6iD5BLzcXcZxo-tk",
  authDomain: "ys-sport-acc.firebaseapp.com",
  projectId: "ys-sport-acc",
  storageBucket: "ys-sport-acc.firebasestorage.app",
  messagingSenderId: "805303864837",
  appId: "1:805303864837:web:44263d5fbe7f23714d566c"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ── منع تكرار تسجيل الحركة عند الضغط أكتر من مرة بسرعة على نفس الزر ──
   بيتجاهل الضغطة التانية على نفس الزر لو جت خلال أقل من 1.2 ثانية،
   وبيستثني أزرار الاستخدام السريع الطبيعي (اختيار منتج، تبديل تبويب، فلتر) ── */
const __recentClicks = new WeakMap();
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const skip = btn.classList.contains('pos-product-btn')
    || btn.classList.contains('pos-pay-btn')
    || btn.classList.contains('action-btn')
    || btn.classList.contains('filter-btn')
    || btn.hasAttribute('data-pid')
    || btn.hasAttribute('data-del-row');
  if(skip) return;
  const now = Date.now();
  const last = __recentClicks.get(btn) || 0;
  if(now - last < 1200){
    e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }
  __recentClicks.set(btn, now);
}, true);
const STATE_DOC = doc(db, 'accounts-app', 'main-state');

let state = { accounts: [], activeId: null };
let safeFilterAccId = 'all';
let isSavingLocally = false; // prevents our own save from triggering a redundant re-render

/* ---------- تسجيل الدخول والصلاحيات (محلي فقط، لا يُحفظ على Firebase) ---------- */
let currentUser = null;      // {id, name, pin, role}
let lockSelectedUser = null;
let lockPinBuffer = '';
let empConfirmMsg = '';      // رسالة تأكيد بعد تسجيل عملية (تُعرض مرة واحدة فقط للموظف)
function showEmpConfirm(msg){ empConfirmMsg = msg; }

function isEmployee(){ return currentUser && currentUser.role === 'employee'; }
function isAdmin(){ return currentUser && currentUser.role === 'admin'; }
const EMP_ALLOWED_TYPES = ['general','cafeteria'];
function empAllowedTypes(){
  const types = ['general','cafeteria'];
  if(currentUser && currentUser.canAccessInstallment) types.push('installment');
  return types;
}

function ensureUsers(){
  if(!Array.isArray(state.users) || state.users.length===0){
    state.users = [{id: uid(), name:'المدير', pin:'1111', role:'admin'}];
  }
  if(!Array.isArray(state.custodyLog)) state.custodyLog = [];
  if(!Array.isArray(state.settleRequests)) state.settleRequests = [];
  if(!Array.isArray(state.pendingCafSales)) state.pendingCafSales = [];
  if(!Array.isArray(state.pendingDeletions)) state.pendingDeletions = [];
}

function custodyBalance(userId){
  return state.custodyLog.filter(x=>x.userId===userId).reduce((s,x)=>s+Number(x.amount||0),0);
}

async function pushCustody(userId, amount, source, desc){
  if(!userId || !amount) return;
  state.custodyLog.push({id:uid(), userId, amount, source, desc, date: todayStr()});
}

/* ── نظام موافقة المدير على مسح أي حركة (مشترك بين كل أنواع الحسابات) ── */
async function requestDeletion(acc, kind, refId, summary){
  state.pendingDeletions.push({id:uid(), accId:acc.id, accName:acc.name, kind, refId, summary,
    userId:currentUser.id, userName:currentUser.name, date:todayStr(), status:'pending'});
  await saveState();
  showEmpConfirm('⏳ اتبعت طلب المسح للمدير — في انتظار الموافقة');
  render();
}

function performDeletion(acc, d){
  if(d.kind==='cafSale'){
    const s = acc.sales.find(x=>x.id===d.refId);
    if(s){ const pr=acc.products.find(x=>x.id===s.productId); if(pr) pr.qty += s.qty;
      acc.sales = acc.sales.filter(x=>x.id!==s.id); }
  } else if(d.kind==='cafPayment'){
    acc.cafPayments = acc.cafPayments.filter(x=>x.id!==d.refId);
  } else if(d.kind==='income'){
    acc.income = acc.income.filter(x=>x.id!==d.refId);
  } else if(d.kind==='expense'){
    acc.expense = acc.expense.filter(x=>x.id!==d.refId);
  } else if(d.kind==='salary'){
    acc.salary = acc.salary.filter(x=>x.id!==d.refId);
  } else if(d.kind==='installmentPayment'){
    acc.payments = acc.payments.filter(x=>x.id!==d.refId);
  }
}

function bindDeletionApprovals(acc){
  document.querySelectorAll('[data-approve-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const d = state.pendingDeletions.find(x=>x.id===btn.dataset.approveDel);
      if(!d) return;
      performDeletion(acc, d);
      d.status = 'approved';
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-reject-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const d = state.pendingDeletions.find(x=>x.id===btn.dataset.rejectDel);
      if(!d) return;
      d.status = 'rejected';
      await saveState(); render();
    });
  });
}

function pendingDeletionsPanel(acc){
  const accPendingDeletions = state.pendingDeletions.filter(d=>d.accId===acc.id && d.status==='pending');
  if(accPendingDeletions.length===0) return '';
  return `
    <div class="section" style="padding:16px;margin-bottom:16px;border:1.5px solid var(--c-red);border-radius:12px;">
      <div class="balances-title" style="margin-top:0;">🗑 طلبات مسح حركات بانتظار الموافقة (${accPendingDeletions.length})</div>
      ${accPendingDeletions.map(d=>`
        <div class="settle-req-row">
          <div class="settle-req-info">
            <b>${escapeHtml(d.userName)}</b> — ${escapeHtml(d.summary)} — ${fmtDate(d.date)}
          </div>
          <div class="settle-req-actions">
            <button class="settle-approve-btn" data-approve-del="${d.id}">✔ موافقة على المسح</button>
            <button class="settle-reject-btn" data-reject-del="${d.id}">✕ رفض</button>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function myPendingDelBadge(kind, refId){
  const req = state.pendingDeletions.find(d=>d.kind===kind && d.refId===refId && d.status==='pending');
  return req ? `<span style="font-size:11.5px;color:var(--ink-soft);font-weight:700;">⏳ طلب المسح قيد المراجعة</span>` : null;
}

function fmt(n){ return new Intl.NumberFormat('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}).format(n || 0); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  const dateObj = new Date(`${y}-${m}-${day}T00:00:00`);
  const dayName = dateObj.toLocaleDateString('ar-EG', {weekday:'long'});
  return `${dayName} ${day}/${m}/${y}`;
}
function monthLabel(ym){
  const names = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const [y,m] = ym.split('-');
  return `${names[parseInt(m,10)-1]} ${y}`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- State (Firebase Firestore, real-time, shared by everyone) ---------- */
async function loadState(){
  try{
    const snap = await getDoc(STATE_DOC);
    if(snap.exists() && snap.data() && snap.data().json){
      state = JSON.parse(snap.data().json);
    } else {
      state = { accounts: [defaultAccount('الملعب','general'), defaultAccount('السلف','loans')], activeId: null };
      state.activeId = state.accounts[0].id;
      await saveState();
    }
  }catch(e){
    console.error('فشل تحميل البيانات من Firebase', e);
    setConnStatus(false);
    state = { accounts: [defaultAccount('الملعب','general'), defaultAccount('السلف','loans')], activeId: null };
    state.activeId = state.accounts[0].id;
  }
  if(!state.activeId && state.accounts.length) state.activeId = state.accounts[0].id;
  state.accounts.forEach(normalizeAccount);
  ensureUsers();
  if(!state.accounts.some(a=>a.type==='loans')){
    state.accounts.push(defaultAccount('السلف','loans'));
    await saveState();
  }
}
async function saveState(){
  try{
    isSavingLocally = true;
    await setDoc(STATE_DOC, { json: JSON.stringify(state), updatedAt: Date.now() });
    setConnStatus(true);
  }catch(e){
    console.error('فشل الحفظ على Firebase', e);
    setConnStatus(false);
  } finally {
    setTimeout(()=>{ isSavingLocally = false; }, 300);
  }
}

function showLockScreen(){
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockUserList').style.display = '';
  document.getElementById('lockPinArea').style.display = 'none';
  lockSelectedUser = null; lockPinBuffer = '';
  renderLockUserList();
}
function hideLockScreen(){
  document.getElementById('lockScreen').style.display = 'none';
}
function renderLockUserList(){
  const list = document.getElementById('lockUserList');
  list.innerHTML = state.users.map(u=>`
    <button class="lock-user-btn" data-uid="${u.id}">
      <span class="lock-user-icon">${u.role==='admin'?'🛡️':'👤'}</span>
      <span>${escapeHtml(u.name)}</span>
    </button>`).join('');
  list.querySelectorAll('[data-uid]').forEach(btn=>{
    btn.addEventListener('click', ()=>openPinEntry(btn.dataset.uid));
  });
}
function openPinEntry(userId){
  lockSelectedUser = state.users.find(u=>u.id===userId);
  if(!lockSelectedUser) return;
  lockPinBuffer = '';
  document.getElementById('lockUserList').style.display = 'none';
  document.getElementById('lockPinArea').style.display = '';
  document.getElementById('lockPinUserName').textContent = `👤 ${lockSelectedUser.name}`;
  document.getElementById('lockPinError').textContent = '';
  renderLockDots();
  renderLockKeypad();
  document.getElementById('lockBackBtn').onclick = showLockScreen;
}
function renderLockDots(){
  const wrap = document.getElementById('lockPinDots');
  const len = Math.max(4, lockPinBuffer.length);
  wrap.innerHTML = Array.from({length: Math.min(len,8)}).map((_,i)=>
    `<span class="lock-dot ${i<lockPinBuffer.length?'filled':''}"></span>`).join('');
}
function renderLockKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✔'];
  document.getElementById('lockKeypad').innerHTML = keys.map(k=>
    `<button class="lock-key ${k==='✔'||k==='⌫'?'wide':''}" data-key="${k}">${k}</button>`).join('');
  document.querySelectorAll('.lock-key').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.key;
      document.getElementById('lockPinError').textContent = '';
      if(k==='⌫'){ lockPinBuffer = lockPinBuffer.slice(0,-1); renderLockDots(); return; }
      if(k==='✔'){ attemptLogin(); return; }
      if(lockPinBuffer.length<8){ lockPinBuffer += k; }
      renderLockDots();
    });
  });
}
function attemptLogin(){
  if(!lockSelectedUser) return;
  if(lockPinBuffer.length>0 && lockPinBuffer === String(lockSelectedUser.pin)){
    currentUser = lockSelectedUser;
    hideLockScreen();
    render();
  } else {
    document.getElementById('lockPinError').textContent = 'الرقم السري غير صحيح';
    lockPinBuffer = '';
    renderLockDots();
  }
}
function logout(){
  currentUser = null;
  showLockScreen();
}

// Real-time listener: any change made by ANY user (anywhere) updates everyone instantly.
onSnapshot(STATE_DOC, (snap)=>{
  if(isSavingLocally) return; // ignore the echo of our own write
  if(!snap.exists()) return;
  const data = snap.data();
  if(!data || !data.json) return;
  const incoming = JSON.parse(data.json);
  if(JSON.stringify(incoming) === JSON.stringify(state)) return;

  // Avoid yanking the form out from under someone who is actively typing
  if(document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;

  state = incoming;
  state.accounts.forEach(normalizeAccount);
  if(!state.activeId && state.accounts.length) state.activeId = state.accounts[0].id;
  ensureUsers();
  if(currentUser) currentUser = state.users.find(u=>u.id===currentUser.id) || currentUser;
  setConnStatus(true);
  render();
}, (err)=>{
  console.error('خطأ في الاتصال المباشر بـ Firebase', err);
  setConnStatus(false);
});

function defaultAccount(name, type){
  if(type === 'cafeteria'){
    return { id: uid(), name, type, products:[], purchases:[], sales:[], cafExpenses:[], cafPayments:[], capitalEntries:[] };
  }
  if(type === 'installment'){
    return { id: uid(), name, type, customers:[], suppliers:[], deals:[], payments:[], capitalEntries:[] };
  }
  if(type === 'loans'){
    return { id: uid(), name, type, loans:[], repayments:[], capitalEntries:[] };
  }
  return { id: uid(), name, type:'general', income:[], expense:[], salary:[], employees:[], empLoans:[], capitalEntries:[] };
}
function normalizeAccount(acc){
  if(!acc.capitalEntries) acc.capitalEntries = [];
  if(acc.type === 'cafeteria'){
    if(!acc.cafPayments) acc.cafPayments = [];
  }
  if(acc.type === 'installment'){
    if(!acc.customers) acc.customers = [];
    if(!acc.suppliers) acc.suppliers = [];
    if(!acc.payments) acc.payments = [];
    if(!acc.deals) acc.deals = [];
  }
  if(acc.type === 'loans'){
    if(!acc.loans) acc.loans = [];
    if(!acc.repayments) acc.repayments = [];
  }
  if(acc.type === 'general'){
    if(!acc.employees) acc.employees = [];
    if(!acc.empLoans) acc.empLoans = [];
  }
  return acc;
}
function getActive(){ return state.accounts.find(a => a.id === state.activeId); }

function empLoanBalance(acc, empId){
  const totalLoaned = acc.empLoans.filter(l=>l.empId===empId && l.type==='loan').reduce((s,l)=>s+Number(l.amount||0),0);
  const totalPaid   = acc.empLoans.filter(l=>l.empId===empId && l.type==='repay').reduce((s,l)=>s+Number(l.amount||0),0);
  return {totalLoaned, totalPaid, remaining: Math.max(0, totalLoaned-totalPaid)};
}

function addMonths(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0,10);
}
function dealStatus(acc, deal){
  const paid = acc.payments.filter(p=>p.dealId===deal.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const remaining = Math.max(0, Number(deal.totalPayable||0) - paid);
  const installmentsPaidCount = deal.monthlyInstallment > 0 ? Math.round(paid / deal.monthlyInstallment) : 0;
  const nextDueDate = remaining > 0 ? addMonths(deal.date, installmentsPaidCount + 1) : null;
  const overdue = !!(nextDueDate && nextDueDate < todayStr());
  return {paid, remaining, installmentsPaidCount, nextDueDate, overdue};
}
function loanStatus(acc, loan){
  const paid = acc.repayments.filter(p=>p.loanId===loan.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const remaining = Math.max(0, Number(loan.amount||0) - paid);
  return {paid, remaining};
}

/* لو المستلف عنده سلفة قائمة (لسه متسددتش خالص)، تُضاف عليها المبلغ الجديد بدل ما تتفتح سلفة/كارت جديد */
function addOrIncreaseLoan(acc, date, borrowerName, amount){
  const existing = acc.loans.find(l =>
    l.borrowerName.trim().toLowerCase() === borrowerName.trim().toLowerCase() &&
    loanStatus(acc, l).remaining > 0
  );
  if(existing){
    existing.amount = Number(existing.amount||0) + amount;
    return existing;
  }
  const loan = {id:uid(), date, borrowerName, amount};
  acc.loans.push(loan);
  return loan;
}

function calcTotalsGeneral(acc){
  const sum = arr => arr.reduce((s,x)=>s+Number(x.amount||0),0);
  const income = sum(acc.income);
  // دمج المصروفات + المرتبات + السلف في بند واحد
  const allExpenses = [
    ...acc.expense.map(x=>({...x, cat: x.cat||'مصروف'})),
    ...acc.salary.map(x=>({...x, cat:'مرتب', amount: Number(x.amount||0)})),
  ];
  const expense = allExpenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const salaryTotal = sum(acc.salary);
  const advances = acc.salary.reduce((s,x)=>s+Number(x.advance||0),0);
  return {income, expense, salaryTotal, advances, net: income-expense, allExpenses};
}
function calcTotalsCafeteria(acc){
  const salesRevenue = acc.sales.reduce((s,x)=>s+Number(x.total||0),0);
  const cogs = acc.sales.reduce((s,x)=>s+Number(x.cogs||0),0);
  const purchasesTotal = acc.purchases.reduce((s,x)=>s+Number(x.total||0),0);
  const expensesTotal = acc.cafExpenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const grossProfit = salesRevenue - cogs;
  const net = grossProfit - expensesTotal;
  const stockValue = acc.products.reduce((s,p)=>s+(Number(p.qty||0)*Number(p.avgCost||0)),0);
  return {salesRevenue, cogs, purchasesTotal, expensesTotal, grossProfit, net, stockValue};
}
function calcTotalsInstallment(acc){
  const totalPrice = acc.deals.reduce((s,d)=>s+Number(d.totalPrice||0),0);
  const totalDown = acc.deals.reduce((s,d)=>s+Number(d.downPayment||0),0);
  const totalFinanced = acc.deals.reduce((s,d)=>s+Number(d.financed||0),0);
  const totalInterest = acc.deals.reduce((s,d)=>s+Number(d.interestAmount||0),0);
  const totalPayable = acc.deals.reduce((s,d)=>s+Number(d.totalPayable||0),0);
  const totalPaidInstallments = acc.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalRemaining = acc.deals.reduce((s,d)=>s+dealStatus(acc,d).remaining, 0);
  const overdueDeals = acc.deals.filter(d=>dealStatus(acc,d).overdue);
  // إجمالي القسط الشهري المجمّع لجميع العملاء (العمليات النشطة فقط)
  const totalMonthlyInstallments = acc.deals
    .filter(d=>dealStatus(acc,d).remaining>0)
    .reduce((s,d)=>s+Number(d.monthlyInstallment||0),0);
  return {totalPrice, totalDown, totalFinanced, totalInterest, totalPayable,
    totalPaidInstallments, totalRemaining, overdueDeals,
    totalMonthlyInstallments, net: totalInterest};
}
function calcTotalsLoans(acc){
  const totalLent = acc.loans.reduce((s,l)=>s+Number(l.amount||0),0);
  const totalRepaid = acc.repayments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalRemaining = acc.loans.reduce((s,l)=>s+loanStatus(acc,l).remaining, 0);
  return {totalLent, totalRepaid, totalRemaining, net:0};
}
function getNet(acc){
  if(acc.type === 'cafeteria') return calcTotalsCafeteria(acc).net;
  if(acc.type === 'installment') return calcTotalsInstallment(acc).net;
  if(acc.type === 'loans') return calcTotalsLoans(acc).net;
  return calcTotalsGeneral(acc).net;
}
function calcCombined(){
  let inflow=0, outflow=0;
  state.accounts.forEach(acc=>{
    if(acc.type === 'cafeteria'){
      const t = calcTotalsCafeteria(acc);
      inflow += t.salesRevenue;
      outflow += t.cogs + t.expensesTotal;
    } else if(acc.type === 'installment'){
      const t = calcTotalsInstallment(acc);
      inflow += t.totalInterest;
    } else if(acc.type === 'loans'){
      // loans don't affect profit/loss — they're just outstanding receivables, no inflow/outflow added
    } else {
      const t = calcTotalsGeneral(acc);
      inflow += t.income;
      outflow += t.expense + t.salary;
    }
  });
  return {inflow, outflow, net: inflow-outflow};
}

function calcCapitalForAcc(acc){
  const entries = acc.capitalEntries || [];
  const totalDeposits = entries.filter(e=>e.type==='deposit').reduce((s,e)=>s+Number(e.amount||0),0);
  const totalWithdrawals = entries.filter(e=>e.type==='withdraw').reduce((s,e)=>s+Number(e.amount||0),0);
  const netCapitalIn = totalDeposits - totalWithdrawals;
  const profitToDate = getNet(acc);
  const currentCapital = netCapitalIn + profitToDate;
  return {totalDeposits, totalWithdrawals, netCapitalIn, profitToDate, currentCapital};
}
function calcCapitalAll(){
  let totalDeposits=0, totalWithdrawals=0;
  state.accounts.forEach(acc=>{
    const c = calcCapitalForAcc(acc);
    totalDeposits += c.totalDeposits;
    totalWithdrawals += c.totalWithdrawals;
  });
  const netCapitalIn = totalDeposits - totalWithdrawals;
  const profitToDate = calcCombined().net;
  const currentCapital = netCapitalIn + profitToDate;
  return {totalDeposits, totalWithdrawals, netCapitalIn, profitToDate, currentCapital};
}

/* ---------- الخزنة (تجميع كل الحسابات نقديًا) ---------- */
function calcSafeForAcc(acc){
  const opsLedger = buildLedger(acc);
  const cashFromOps = opsLedger.reduce((s,e)=>s+e.amount,0);
  return { balance: cashFromOps };
}
function calcSafeAll(){
  let balance=0;
  state.accounts.forEach(acc=>{
    balance += calcSafeForAcc(acc).balance;
  });
  return { balance };
}
function buildGlobalSafeLedger(){
  let entries = [];
  state.accounts.forEach(acc=>{
    buildLedger(acc).forEach(e=>{
      entries.push({date:e.date, desc:e.desc, type:e.type, amount:e.amount, accName:acc.name, accId:acc.id});
    });
  });
  entries.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  let balance = 0;
  return entries.map(e => { balance += e.amount; return {...e, balance}; });
}

function bindNewAccountBox(){

  const doAdd = async ()=>{
    const name = input.value.trim();
    if(!name) return;
    const acc = defaultAccount(name, typeSel.value);
    state.accounts.push(acc);
    state.activeId = acc.id;
    await saveState(); render();
  };
  submit.addEventListener('click', doAdd);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
}

function bindActionBar(){
  document.querySelectorAll('.action-btn[data-panel]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.panel;
      document.querySelectorAll('.action-panel').forEach(p=>{
        const open = p.id===id && !p.classList.contains('open');
        p.classList.toggle('open', open);
        document.querySelector(`.action-btn[data-panel="${p.id}"]`)?.classList.toggle('active', open);

    });
  });
}

const AR_MONTHS_SHORT = ['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
function monthShortLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${AR_MONTHS_SHORT[m-1]} ${String(y).slice(2)}`;
}

/* ---------- متابعة الإيراد اليومي (تقويم) ---------- */
function shiftYm(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function daysInYm(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function buildIncomeDayMap(acc, ym){
  const map = {};
  acc.income.forEach(it=>{
    if((it.date||'').slice(0,7) === ym) map[it.date] = (map[it.date]||0) + Number(it.amount||0);
  });
  return map;
}
function renderRevenueCalendar(acc, hideAmounts){
  const today = todayStr();
  const ym = /^\d{4}-\d{2}$/.test(acc._revCalMonth||'') ? acc._revCalMonth : today.slice(0,7);
  const [y,m] = ym.split('-').map(Number);
  const dim = daysInYm(ym);
  const dayMap = buildIncomeDayMap(acc, ym);
  const firstOffset = (new Date(y, m-1, 1).getDay() + 1) % 7; // 0=سبت

  let missingCount = 0;
  const cells = [];
  for(let i=0;i<firstOffset;i++) cells.push('<div class="revcal-cell empty"></div>');
  for(let d=1; d<=dim; d++){
    const dateStr = `${ym}-${String(d).padStart(2,'0')}`;
    const amt = dayMap[dateStr];
    const isFuture = dateStr > today;
    const isToday = dateStr === today;
    let cls = 'revcal-cell';
    let inner = `<span class="revcal-num">${d}</span>`;
    if(amt !== undefined){
      cls += ' rc-done';
      if(!hideAmounts) inner += `<span class="revcal-amt">${fmt(amt)}</span>`;
      else inner += `<span class="revcal-amt">✓</span>`;
    } else if(isFuture){
      cls += ' rc-future';
    } else {
      cls += ' rc-missing';
      inner += `<span class="revcal-warn">لا يوجد</span>`;
      missingCount++;
    }
    if(isToday) cls += ' rc-today';
    const dataAttr = (amt===undefined && !isFuture) ? ` data-quick-date="${dateStr}"` : '';
    cells.push(`<div class="${cls}"${dataAttr}>${inner}</div>`);
  }

  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const label = `${monthNames[m-1]} ${y}`;
  const showTodayAlert = ym === today.slice(0,7) && dayMap[today] === undefined;

  return `
    <div class="section revcal-section">
      <div class="section-head">
        <div class="title"><span class="dot income"></span>متابعة الإيراد اليومي</div>
        <div class="revcal-nav">
          <button class="revcal-nav-btn" data-cal-move="-1" type="button">‹</button>
          <span class="revcal-label">${label}</span>
          <button class="revcal-nav-btn" data-cal-move="1" type="button">›</button>
        </div>
      </div>
      ${showTodayAlert ? `<div class="revcal-alert">⚠ النهاردة (${fmtDate(today)}) لسه ملهوش إيراد متسجل — اضغط عليه تحت للتسجيل السريع</div>` : ''}
      ${missingCount>0
        ? `<div class="revcal-summary">⚠ ${missingCount} يوم في الشهر ده لسه من غير إيراد مسجل</div>`
        : `<div class="revcal-summary ok">✅ كل الأيام اللي فاتت في الشهر ده متسجل ليها إيراد</div>`}
      <div class="revcal-weekdays"><span>سبت</span><span>أحد</span><span>اثنين</span><span>ثلاثاء</span><span>أربعاء</span><span>خميس</span><span>جمعة</span></div>
      <div class="revcal-grid">${cells.join('')}</div>
    </div>`;
}

  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn=>{
    btn.addEventListener('click',()=>{ acc._expFilter=btn.dataset.filter; render(); });
  });

  // إضافة موظف جديد
  document.getElementById('addNewEmpBtn')?.addEventListener('click', async ()=>{
    const name = document.getElementById('newEmpName').value.trim();
    if(!name) return;
    if(acc.employees.find(e=>e.name===name)){ alert('الموظف موجود بالفعل'); return; }
    acc.employees.push({id:uid(), name});
    await saveState(); render();
  });

  // حذف موظف
  document.querySelectorAll('[data-del-emp]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('حذف الموظف سيحذف سجل سلفه. هل أنت متأكد؟')) return;
      const empId = btn.dataset.delEmp;
      acc.employees = acc.employees.filter(e=>e.id!==empId);
      acc.empLoans  = acc.empLoans.filter(l=>l.empId!==empId);
      await saveState(); render();
    });
  });

  // إضافة سلفة موظف
  document.getElementById('addEmpLoanBtn')?.addEventListener('click', async ()=>{
    const date   = document.getElementById('empLoanDate').value || todayStr();
    const empId  = document.getElementById('empLoanSel').value;
    const amount = parseFloat(document.getElementById('empLoanAmount').value);
    const note   = document.getElementById('empLoanNote').value.trim();
    if(!empId || isNaN(amount) || amount<=0) return;
    const emp = acc.employees.find(e=>e.id===empId);
    acc.empLoans.push({id:uid(), date, empId, empName:emp.name, amount, note, type:'loan'});
    // تسجيل السلفة كمصروف أيضاً
    acc.expense.push({id:uid(), date, desc:`سلفة: ${emp.name}${note?' — '+note:''}`, amount, cat:'سلفة'});
    await saveState(); render();
  });

  // اختيار موظف في صرف المرتب — عرض السلفة المتبقية
  const salEmpSel = document.getElementById('salEmpSel');
  if(salEmpSel){
    salEmpSel.addEventListener('change', ()=>{
      const empId = salEmpSel.value;
      const nameInput = document.getElementById('salEmpName');
      const info = document.getElementById('salAdvanceInfo');
      if(empId === '__other__'){
        nameInput.style.display=''; if(info) info.style.display='none'; return;
      }
      nameInput.style.display='none';
      if(!empId){ if(info) info.style.display='none'; return; }
      const bal = empLoanBalance(acc, empId);
      if(info && bal.remaining>0){
        info.style.display='';
        document.getElementById('salAdvanceBalance').textContent = fmt(bal.remaining);
        document.getElementById('salDeductAmt').value = bal.remaining;
      } else if(info){
        info.style.display='none';
      }
    });
  }

  // صرف مرتب مع خصم سلفة تلقائي
  document.getElementById('addSalBtn')?.addEventListener('click', async ()=>{
    const date   = document.getElementById('salDate').value || todayStr();
    const empId  = document.getElementById('salEmpSel').value;
    const amount = parseFloat(document.getElementById('salAmount').value);
    if(isNaN(amount) || amount<=0) return;

    let empName = '';
    let actualEmpId = null;
    if(empId === '__other__'){
      empName = document.getElementById('salEmpName').value.trim();
      if(!empName) return;
    } else if(empId){
      const emp = acc.employees.find(e=>e.id===empId);
      empName = emp.name; actualEmpId = empId;
    } else { alert('اختر الموظف'); return; }

    // خصم السلفة
    let deduct = 0;
    if(actualEmpId){
      const bal = empLoanBalance(acc, actualEmpId);
      if(bal.remaining>0){
        const deductInput = parseFloat(document.getElementById('salDeductAmt')?.value)||0;
        deduct = Math.min(deductInput, bal.remaining, amount);
        if(deduct>0){
          acc.empLoans.push({id:uid(), date, empId:actualEmpId, empName, amount:deduct, note:'خصم من المرتب', type:'repay'});
        }
      }
    }

    acc.salary.push({id:uid(), date, desc:empName, amount, advance:deduct, deduct, cat:'مرتب', empId:actualEmpId, createdBy: currentUser?.id||null});
    if(isEmployee()) await pushCustody(currentUser.id, -amount, 'الملعب: '+acc.name, 'مرتب '+empName);
    await saveState();
    showEmpConfirm(`✔ اتصرف مرتب ${empName} بمبلغ ${fmt(amount)}`);
    render();
  });

  // تقويم متابعة الإيراد اليومي — التنقل بين الشهور
  document.querySelectorAll('.revcal-nav-btn[data-cal-move]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const base = /^\d{4}-\d{2}$/.test(acc._revCalMonth||'') ? acc._revCalMonth : todayStr().slice(0,7);
      acc._revCalMonth = shiftYm(base, parseInt(btn.dataset.calMove,10));
      render();
    });
  });

  // تقويم متابعة الإيراد اليومي — تسجيل سريع بالضغط على يوم ناقص
  document.querySelectorAll('.revcal-cell[data-quick-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      document.querySelectorAll('.action-panel').forEach(p=>p.classList.toggle('open', p.id==='panel-income'));
      document.querySelector('.action-btn[data-panel="panel-income"]')?.classList.add('active');
      const dateInput = document.getElementById('incDate');
      const amountInput = document.getElementById('incAmount');
      if(dateInput) dateInput.value = cell.dataset.quickDate;
      document.getElementById('panel-income')?.scrollIntoView({behavior:'smooth', block:'center'});
      amountInput?.focus();
    });
  });

  // إيراد
  document.getElementById('addIncBtn')?.addEventListener('click', async ()=>{
    const date=document.getElementById('incDate').value||todayStr();
    const desc=document.getElementById('incDesc').value.trim();
    const amount=parseFloat(document.getElementById('incAmount').value);
    if(!desc||isNaN(amount)) return;
    acc.income.push({id:uid(),date,desc,amount, createdBy: currentUser?.id||null});
    if(isEmployee()) await pushCustody(currentUser.id, amount, 'الملعب: '+acc.name, desc);
    await saveState();
    showEmpConfirm(`✔ اتسجل إيراد بـ ${fmt(amount)} بتاريخ ${fmtDate(date)}`);
    render();
  });

  // مصروف
  document.getElementById('addExpBtn')?.addEventListener('click', async ()=>{
    const date   = document.getElementById('expDate').value || todayStr();
    const catRaw = document.getElementById('expCat').value.trim();
    const cat    = catRaw || 'مصروف';
    const desc   = document.getElementById('expDesc').value.trim();
    const amount = parseFloat(document.getElementById('expAmount').value);
    if(!desc || isNaN(amount)) return;
    if(cat==='مرتب'||cat==='سلفة'){
      acc.salary.push({id:uid(), date, desc, amount, advance:0, cat, createdBy: currentUser?.id||null});
    } else {
      acc.expense.push({id:uid(), date, desc, amount, cat, createdBy: currentUser?.id||null});
    }
    if(isEmployee()) await pushCustody(currentUser.id, -amount, 'الملعب: '+acc.name, desc);
    await saveState();
    showEmpConfirm(`✔ اتسجل مصروف "${desc}" بمبلغ ${fmt(amount)}`);
    render();
  });

  // حذف إيراد / مصروف (المدير فقط — مباشر)
  document.querySelectorAll('[data-del-income]').forEach(b=>b.addEventListener('click',async()=>{
    acc.income=acc.income.filter(x=>x.id!==b.dataset.delIncome); await saveState(); render();
  }));
  document.querySelectorAll('[data-del-exp]').forEach(b=>b.addEventListener('click',async()=>{
    const [src,id]=b.dataset.delExp.split(':');
    if(src==='salary') acc.salary=acc.salary.filter(x=>x.id!==id);
    else acc.expense=acc.expense.filter(x=>x.id!==id);
    await saveState(); render();
  }));

  // الموظف: طلب مسح إيراد/مصروف/مرتب — يحتاج موافقة المدير
  document.querySelectorAll('[data-req-del-income]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const x = acc.income.find(v=>v.id===btn.dataset.reqDelIncome);
      if(!x) return;
      await requestDeletion(acc, 'income', x.id, `إيراد: ${x.desc} — ${fmt(x.amount)}`);
    });
  });
  document.querySelectorAll('[data-req-del-expense]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const x = acc.expense.find(v=>v.id===btn.dataset.reqDelExpense);
      if(!x) return;
      await requestDeletion(acc, 'expense', x.id, `مصروف: ${x.desc} — ${fmt(x.amount)}`);
    });
  });
  document.querySelectorAll('[data-req-del-salary]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const x = acc.salary.find(v=>v.id===btn.dataset.reqDelSalary);
      if(!x) return;
      await requestDeletion(acc, 'salary', x.id, `مرتب: ${x.desc} — ${fmt(x.amount)}`);
    });
  });

  // المدير: موافقة/رفض طلبات المسح
  bindDeletionApprovals(acc);
}

  /* بطاقات أرصدة العملاء */
  const custNames = [...new Set(acc.sales.filter(s=>s.customer).map(s=>s.customer))];
  const custCards = custNames.length===0 ? '' : custNames.map(name=>{
    const creditSales = acc.sales.filter(s=>s.customer===name && s.payType==='credit');

    const totalCredit = creditSales.reduce((s,x)=>s+Number(x.total||0),0);
    const totalCash   = cashSales.reduce((s,x)=>s+Number(x.total||0),0);
    const totalPaid   = acc.cafPayments.filter(p=>p.customer===name).reduce((s,x)=>s+Number(x.amount||0),0);

    return `<div class="balance-card ${remaining>0?'owed':'clear'}">

      <div class="balance-row big"><span>${remaining>0?'الرصيد المتبقي:':'الحالة:'}</span>

        <tbody>${acc.products.length===0?`<tr><td colspan="5" class="empty-row">لا يوجد مخزون بعد</td></tr>`:
          acc.products.map(p=>`<tr>

// cart state (in-memory, not persisted - resets on navigate)
let posCart = {};

function openEditPurchase(acc, purchaseId){
  const overlay = document.getElementById('editPurchaseOverlay');
  const modal   = document.getElementById('editPurchaseModal');
  const p       = acc.purchases.find(x=>x.id===purchaseId);
  if(!p) return;

  function calcPreview(){
    const qty  = parseFloat(document.getElementById('epur-qty')?.value)||0;
    const cost = parseFloat(document.getElementById('epur-cost')?.value)||0;
    const el   = document.getElementById('epur-total-preview');
    if(el) el.textContent = fmt(qty * cost);
  }

  modal.innerHTML = `
    <div class="edm-title">✏️ تعديل فاتورة استلام — ${escapeHtml(p.productName)}</div>
    <div class="edm-row"><label class="edm-lbl">التاريخ</label>
      <input class="edm-input" id="epur-date" type="date" value="${p.date}"></div>
    <div class="edm-row"><label class="edm-lbl">اسم البضاعة</label>
      <input class="edm-input" id="epur-name" type="text" value="${escapeHtml(p.productName)}" list="epurProductList">
      <datalist id="epurProductList">${acc.products.map(pr=>`<option value="${escapeHtml(pr.name)}">`).join('')}</datalist></div>
    <div class="edm-row"><label class="edm-lbl">المورد</label>
      <input class="edm-input" id="epur-supplier" type="text" value="${escapeHtml(p.supplier||'')}"></div>
    <div class="edm-row"><label class="edm-lbl">الكمية</label>
      <input class="edm-input" id="epur-qty" type="number" value="${p.qty}" step="0.01" min="0.01"></div>
    <div class="edm-row"><label class="edm-lbl">سعر الشراء للوحدة</label>
      <input class="edm-input" id="epur-cost" type="number" value="${p.unitCost}" step="0.01" min="0"></div>
    <div class="edm-result">
      <span class="edm-result-lbl">إجمالي الفاتورة</span>
      <span class="edm-result-val" id="epur-total-preview">${fmt(p.total)}</span>
    </div>
    <div class="edm-actions">
      <button class="edm-cancel" id="epur-cancel">إلغاء</button>
      <button class="edm-save" id="epur-save">✔ حفظ التعديلات</button>
    </div>
  `;

  overlay.classList.add('open');
  ['epur-qty','epur-cost'].forEach(id=>
    document.getElementById(id)?.addEventListener('input', calcPreview));

  document.getElementById('epur-cancel').onclick = ()=> overlay.classList.remove('open');

  document.getElementById('epur-save').onclick = async ()=>{
    const date     = document.getElementById('epur-date').value || p.date;
    const name     = document.getElementById('epur-name').value.trim();
    const supplier = document.getElementById('epur-supplier').value.trim();
    const qty      = parseFloat(document.getElementById('epur-qty').value);
    const unitCost = parseFloat(document.getElementById('epur-cost').value);
    if(!name || isNaN(qty) || qty<=0 || isNaN(unitCost) || unitCost<0) return;

    // عكس تأثير الشراء القديم على المخزون
    const oldProduct = acc.products.find(pr=>pr.id===p.productId);
    if(oldProduct){
      oldProduct.qty = Math.max(0, oldProduct.qty - p.qty);
    }

    // تطبيق الشراء الجديد
    let product = acc.products.find(pr=>pr.name.trim()===name);
    if(!product){ product={id:uid(),name,qty:0,avgCost:0,sellPrice:0}; acc.products.push(product); }
    const newQty = product.qty + qty;
    product.avgCost = newQty>0 ? ((product.qty*product.avgCost)+(qty*unitCost))/newQty : unitCost;
    product.qty = newQty;

    // تحديث بيانات الفاتورة
    Object.assign(p, {date, productId:product.id, productName:product.name,
      supplier, qty, unitCost, total:qty*unitCost});

    overlay.classList.remove('open');
    await saveState(); render();
  };
  overlay.onclick = e=>{ if(e.target===overlay) overlay.classList.remove('open'); };
}

function bindCafeteria(){
  const acc = getActive();
  bindActionBar();
  posCart = {};
  renderCart(acc);

  // ── اختيار منتج من الشبكة ──
  document.querySelectorAll('.pos-product-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const pid = btn.dataset.pid;
      const product = acc.products.find(p=>p.id===pid);
      if(!product||product.qty<=0) return;
      if(!posCart[pid]) posCart[pid] = {product, qty:0, unitPrice: product.sellPrice||product.avgCost||0};
      if(posCart[pid].qty >= product.qty){ alert(`الكمية المتاحة: ${fmt(product.qty)} فقط`); return; }
      posCart[pid].qty++;
      renderCart(acc);
    });
  });

  // ── أزرار طريقة الدفع ──
  let posPayType = 'cash';
  document.querySelectorAll('.pos-pay-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      posPayType = btn.dataset.type;
      document.querySelectorAll('.pos-pay-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const checkoutBtn = document.getElementById('posCheckoutBtn');
      if(posPayType==='credit'){
        checkoutBtn.textContent = '📋 تسجيل آجل';
        checkoutBtn.style.background = 'linear-gradient(135deg,#d99a1a,#ffce55)';
      } else {
        checkoutBtn.textContent = '✔ تحصيل وحفظ الفاتورة';
        checkoutBtn.style.background = 'linear-gradient(135deg,#1f9e5c,#4fdb93)';
      }
    });
  });

  // ── تحصيل الفاتورة ──
  document.getElementById('posCheckoutBtn').addEventListener('click', async ()=>{
    const items = Object.values(posCart).filter(x=>x.qty>0);
    if(items.length===0){ alert('أضف منتجًا أولًا'); return; }
    if(posPayType==='credit' && !document.getElementById('posCustomer').value.trim()){
      alert('البيع الآجل يتطلب كتابة اسم العميل'); return;
    }
    const date = document.getElementById('posDate').value || todayStr();
    const customer = document.getElementById('posCustomer').value.trim();
    const payType = posPayType; // cash | credit

    // تحقق من توفر الكمية قبل أي حفظ (سواء مباشر أو للموافقة)
    for(const item of items){
      const product = acc.products.find(p=>p.id===item.product.id);
      if(!product || item.qty > product.qty){
        alert(`الكمية المتاحة من "${item.product.name}" هي ${fmt(product?product.qty:0)} فقط`); return;
      }
    }

    // ── الموظف اللي عليه قفل الموافقة: تتبعت الفاتورة للمدير من غير خصم مخزون ──
    if(isEmployee() && currentUser.needsSaleApproval){
      const reqItems = items.map(item=>{
        const product = acc.products.find(p=>p.id===item.product.id);
        return {productId:product.id, productName:product.name, qty:item.qty, unitPrice:item.unitPrice, total:item.qty*item.unitPrice};
      });
      const cashTotal = payType==='cash' ? reqItems.reduce((s,x)=>s+x.total,0) : 0;
      state.pendingCafSales.push({
        id:uid(), accId:acc.id, accName:acc.name, date, customer, payType, items:reqItems, cashTotal,
        userId:currentUser.id, userName:currentUser.name, status:'pending', requestedAt: Date.now()
      });
      posCart = {};
      await saveState();
      showEmpConfirm('⏳ اتبعتت الفاتورة للمدير — في انتظار الموافقة');
      render();
      return;
    }

    let cashTotal = 0;
    for(const item of items){
      const product = acc.products.find(p=>p.id===item.product.id);
      if(!product) continue;
      const cogs = item.qty * product.avgCost;
      product.qty -= item.qty;
      const total = item.qty*item.unitPrice;
      if(payType==='cash') cashTotal += total;
      acc.sales.push({id:uid(), date, productId:product.id, productName:product.name,
        customer, qty:item.qty, unitPrice:item.unitPrice,
        total, cogs, payType, createdBy: currentUser?.id||null});
    }
    posCart = {};
    if(isEmployee() && cashTotal>0) await pushCustody(currentUser.id, cashTotal, 'كافتيريا: '+acc.name, 'مبيعات نقدية');
    await saveState();
    if(isEmployee()) showEmpConfirm(`✔ اتسجلت الفاتورة${cashTotal>0?` — استلمت ${fmt(cashTotal)}`:''}`);
    render();
  });

  // ── المدير: موافقة/رفض طلبات بيع الكافيتريا المعلّقة ──
  document.querySelectorAll('[data-approve-sale]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = state.pendingCafSales.find(x=>x.id===btn.dataset.approveSale);
      if(!r) return;
      for(const it of r.items){
        const product = acc.products.find(p=>p.id===it.productId);
        if(!product || it.qty > product.qty){
          alert(`الكمية المتاحة من "${it.productName}" مش كافية دلوقتي (${product?fmt(product.qty):0}) — البضاعة اتغيرت من وقت الطلب`);
          return;
        }
      }
      let cashTotal = 0;
      for(const it of r.items){
        const product = acc.products.find(p=>p.id===it.productId);
        const cogs = it.qty * product.avgCost;
        product.qty -= it.qty;
        if(r.payType==='cash') cashTotal += it.total;
        acc.sales.push({id:uid(), date:r.date, productId:product.id, productName:product.name,
          customer:r.customer, qty:it.qty, unitPrice:it.unitPrice, total:it.total, cogs, payType:r.payType, createdBy:r.userId});
      }
      if(cashTotal>0) await pushCustody(r.userId, cashTotal, 'كافتيريا: '+acc.name, 'مبيعات نقدية (بموافقة المدير)');
      r.status = 'approved';
      await saveState(); render();
    });
  });
  document.querySelectorAll('[data-reject-sale]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = state.pendingCafSales.find(x=>x.id===btn.dataset.rejectSale);
      if(!r) return;
      r.status = 'rejected';
      await saveState(); render();
    });
  });

  document.querySelectorAll('[data-req-del-sale]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const s = acc.sales.find(x=>x.id===btn.dataset.reqDelSale);
      if(!s) return;
      const summary = `بيع: ${s.productName} ×${fmt(s.qty)} — ${s.customer||'نقدي'} — ${fmt(s.total)}`;
      await requestDeletion(acc, 'cafSale', s.id, summary);
    });
  });
  document.querySelectorAll('[data-req-del-cafpay]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const p = acc.cafPayments.find(x=>x.id===btn.dataset.reqDelCafpay);
      if(!p) return;
      const summary = `تحصيل من ${p.customer} — ${fmt(p.amount)}`;
      await requestDeletion(acc, 'cafPayment', p.id, summary);
    });
  });

  bindDeletionApprovals(acc);

  // ── تسعير المنتجات ──
  const savePricesBtn = document.getElementById('saveSellPricesBtn');
  if(savePricesBtn){
    savePricesBtn.addEventListener('click', async ()=>{
      document.querySelectorAll('.sell-price-input').forEach(inp=>{
        const pid = inp.dataset.pid;
        const product = acc.products.find(p=>p.id===pid);
        if(product) product.sellPrice = parseFloat(inp.value)||0;
      });
      await saveState(); render();
    });
  }

  // ── استلام بضاعة (قائمة متعددة) — للمدير فقط ──
  let purchaseCart = [];
  function renderPurchaseCart(){
    const container = document.getElementById('purchaseCartItems');
    const totalEl   = document.getElementById('purchaseTotalDisplay');
    if(!container) return;
    if(purchaseCart.length===0){
      container.innerHTML = `<div class="purchase-empty">لم تضف أي بند بعد — أضف من الأعلى</div>`;
      if(totalEl) totalEl.textContent = '0';
      return;
    }
    let total = 0;
    container.innerHTML = purchaseCart.map((item,i)=>{
      const lineTotal = item.qty * item.unitCost;
      total += lineTotal;
      return `<div class="purchase-cart-row">
        <span class="purch-name">${escapeHtml(item.name)}</span>
        <span class="purch-detail">${escapeHtml(item.supplier||'—')}</span>
        <span class="purch-detail">${fmt(item.qty)} × ${fmt(item.unitCost)}</span>
        <span class="purch-total">${fmt(lineTotal)}</span>
        <button class="del-btn" data-del-row="${i}">✕</button>
      </div>`;
    }).join('');
    if(totalEl) totalEl.textContent = fmt(total);
    container.querySelectorAll('[data-del-row]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        purchaseCart.splice(parseInt(btn.dataset.delRow),1);
        renderPurchaseCart();
      });
    });
  }

  if(isAdmin()){
  document.getElementById('addPurchaseRowBtn').addEventListener('click', ()=>{
    const name     = document.getElementById('purchaseProductName').value.trim();
    const supplier = document.getElementById('purchaseSupplier').value.trim();
    const qty      = parseFloat(document.getElementById('purchaseQty').value);
    const unitCost = parseFloat(document.getElementById('purchaseUnitCost').value);
    if(!name || isNaN(qty) || qty<=0 || isNaN(unitCost) || unitCost<0) return;
    purchaseCart.push({name, supplier, qty, unitCost});
    document.getElementById('purchaseProductName').value = '';
    document.getElementById('purchaseQty').value = '';
    document.getElementById('purchaseUnitCost').value = '';
    document.getElementById('purchaseProductName').focus();
    renderPurchaseCart();
  });

  // Enter في حقل السعر يضيف مباشرة
  document.getElementById('purchaseUnitCost').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('addPurchaseRowBtn').click();
  });

  document.getElementById('savePurchaseBtn').addEventListener('click', async ()=>{
    if(purchaseCart.length===0){ alert('أضف بندًا واحدًا على الأقل'); return; }
    const date = document.getElementById('purchaseDate').value || todayStr();
    for(const item of purchaseCart){
      let product = acc.products.find(p=>p.name.trim()===item.name);
      if(!product){ product={id:uid(),name:item.name,qty:0,avgCost:0,sellPrice:0}; acc.products.push(product); }
      const newQty = product.qty + item.qty;
      product.avgCost = newQty>0 ? ((product.qty*product.avgCost)+(item.qty*item.unitCost))/newQty : item.unitCost;
      product.qty = newQty;
      acc.purchases.push({id:uid(), date, productId:product.id, productName:product.name,
        supplier:item.supplier, qty:item.qty, unitCost:item.unitCost, total:item.qty*item.unitCost});
    }
    purchaseCart = [];
    await saveState(); render();
  });

  renderPurchaseCart();

  document.getElementById('addCafExpBtn').addEventListener('click', async ()=>{
    const date=document.getElementById('cafExpDate').value||todayStr();
    const desc=document.getElementById('cafExpDesc').value.trim();
    const kind=document.getElementById('cafExpKind').value;
    const amount=parseFloat(document.getElementById('cafExpAmount').value);
    if(!desc||isNaN(amount)) return;
    acc.cafExpenses.push({id:uid(),date,desc,kind,amount});
    await saveState(); render();
  });
  }

  document.getElementById('addCafPayBtn').addEventListener('click', async ()=>{
    const date=document.getElementById('cafPayDate').value||todayStr();
    const customer=document.getElementById('cafPayCustomer').value.trim();
    const amount=parseFloat(document.getElementById('cafPayAmount').value);
    if(!customer||isNaN(amount)||amount<=0) return;
    acc.cafPayments.push({id:uid(),date,customer,amount, createdBy: currentUser?.id||null});
    if(isEmployee()) await pushCustody(currentUser.id, amount, 'كافتيريا: '+acc.name, 'تحصيل من '+customer);
    await saveState();
    if(isEmployee()) showEmpConfirm(`✔ اتسجل تحصيل ${fmt(amount)} من ${customer}`);
    render();
  });

  document.querySelectorAll('[data-del-cafpay]').forEach(btn=>btn.addEventListener('click',async()=>{
    acc.cafPayments=acc.cafPayments.filter(x=>x.id!==btn.dataset.delCafpay);
    await saveState(); render();
  }));
  document.querySelectorAll('[data-edit-purchase]').forEach(btn=>{
    btn.addEventListener('click', ()=> openEditPurchase(acc, btn.dataset.editPurchase));
  });

  document.querySelectorAll('[data-del-purchase]').forEach(btn=>btn.addEventListener('click',async()=>{
    const p=acc.purchases.find(x=>x.id===btn.dataset.delPurchase);
    if(p){ const pr=acc.products.find(x=>x.id===p.productId); if(pr) pr.qty=Math.max(0,pr.qty-p.qty);
      acc.purchases=acc.purchases.filter(x=>x.id!==p.id); await saveState(); render(); }
  }));
  document.querySelectorAll('[data-del-sale]').forEach(btn=>btn.addEventListener('click',async()=>{
    const s=acc.sales.find(x=>x.id===btn.dataset.delSale);
    if(s){ const pr=acc.products.find(x=>x.id===s.productId); if(pr) pr.qty+=s.qty;
      acc.sales=acc.sales.filter(x=>x.id!==s.id); await saveState(); render(); }
  }));
  document.querySelectorAll('[data-del-cafexpense]').forEach(btn=>btn.addEventListener('click',async()=>{
    acc.cafExpenses=acc.cafExpenses.filter(x=>x.id!==btn.dataset.delCafexpense); await saveState(); render();
  }));
}

function renderCart(acc){
  const items = Object.values(posCart).filter(x=>x.qty>0);
  const container = document.getElementById('posCartItems');
  const totalEl = document.getElementById('posTotalDisplay');
  if(!container) return;
  if(items.length===0){
    container.innerHTML = `<div class="pos-cart-empty">لم تختر أي منتج بعد</div>`;
    if(totalEl) totalEl.textContent = '0';
    return;
  }
  let total = 0;
  container.innerHTML = items.map(item=>{
    const lineTotal = item.qty * item.unitPrice;
    total += lineTotal;
    return `
      <div class="pos-cart-row">
        <span class="pos-cart-name">${escapeHtml(item.product.name)}</span>
        <div class="pos-cart-controls">
          <button class="pos-qty-btn" data-dec="${item.product.id}">−</button>
          <input type="number" class="pos-cart-qty-input" data-pid="${item.product.id}" value="${item.qty}" min="1" step="any" inputmode="decimal">
          <button class="pos-qty-btn" data-inc="${item.product.id}">+</button>
        </div>
        <span class="pos-cart-price">${fmt(lineTotal)}</span>
        <button class="pos-cart-del" data-rem="${item.product.id}">✕</button>
      </div>
      <div class="pos-price-edit">
        <span>سعر الوحدة:</span>
        <input type="number" class="pos-price-input" data-pid="${item.product.id}"
          value="${item.unitPrice}" step="0.01" min="0">
      </div>`;
  }).join('');
  if(totalEl) totalEl.textContent = fmt(total);

  // ربط الأزرار
  container.querySelectorAll('[data-inc]').forEach(btn=>btn.addEventListener('click',()=>{
    const pid=btn.dataset.inc; const product=acc.products.find(p=>p.id===pid);
    if(posCart[pid] && product && posCart[pid].qty<product.qty){ posCart[pid].qty++; renderCart(acc); }
    else if(product) alert(`الكمية المتاحة: ${fmt(product.qty)}`);
  }));
  container.querySelectorAll('[data-dec]').forEach(btn=>btn.addEventListener('click',()=>{
    const pid=btn.dataset.dec;
    if(posCart[pid]){ posCart[pid].qty=Math.max(0,posCart[pid].qty-1);
      if(posCart[pid].qty===0) delete posCart[pid]; renderCart(acc); }
  }));
  container.querySelectorAll('[data-rem]').forEach(btn=>btn.addEventListener('click',()=>{
    delete posCart[btn.dataset.rem]; renderCart(acc);
  }));
  container.querySelectorAll('.pos-cart-qty-input').forEach(inp=>inp.addEventListener('change',()=>{
    const pid = inp.dataset.pid;
    if(!posCart[pid]) return;
    const product = acc.products.find(p=>p.id===pid);
    let val = parseFloat(inp.value);
    if(isNaN(val) || val<=0){ delete posCart[pid]; renderCart(acc); return; }
    if(product && val > product.qty){
      alert(`الكمية المتاحة: ${fmt(product.qty)}`);
      val = product.qty;
    }
    posCart[pid].qty = val;
    renderCart(acc);
  }));
  container.querySelectorAll('.pos-price-input').forEach(inp=>inp.addEventListener('input',()=>{
    const pid=inp.dataset.pid; if(posCart[pid]) posCart[pid].unitPrice=parseFloat(inp.value)||0; renderCart(acc);
  }));
}
